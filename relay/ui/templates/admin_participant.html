{{define "content"}}
<div class="row">
  <a class="btn" data-variant="ghost" data-size="sm" href="/admin">← Overview</a>
  <h1 class="h1">{{.Participant.ID}} · {{.Participant.Name}}</h1>
</div>
<p class="small">Webhook URL: {{if .WebhookURL}}<span class="mono">{{.WebhookURL}}</span>{{else}}<span class="muted">not set</span>{{end}}</p>
<div class="tabs" id="detail">
  <nav role="tablist" aria-orientation="horizontal">
    <button type="button" role="tab" id="detail-tab-ns" aria-controls="detail-panel-ns" aria-selected="true" tabindex="0">Namespaces</button>
    <button type="button" role="tab" id="detail-tab-del" aria-controls="detail-panel-del" aria-selected="false" tabindex="-1">Deliveries</button>
    <button type="button" role="tab" id="detail-tab-jr" aria-controls="detail-panel-jr" aria-selected="false" tabindex="-1">Journal</button>
  </nav>
  <div role="tabpanel" id="detail-panel-ns" aria-labelledby="detail-tab-ns" tabindex="-1" aria-selected="true">
    <div class="card"><section>{{template "namespaces-table" .}}</section></div>
  </div>
  <div role="tabpanel" id="detail-panel-del" aria-labelledby="detail-tab-del" tabindex="-1" aria-selected="false" hidden>
    <div class="card"><section>{{template "deliveries" .}}</section></div>
  </div>
  <div role="tabpanel" id="detail-panel-jr" aria-labelledby="detail-tab-jr" tabindex="-1" aria-selected="false" hidden>
    <div class="card"><section>{{template "journal-table" .}}</section></div>
  </div>
</div>
{{end}}

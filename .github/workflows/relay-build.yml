name: relay-build

on:
  push:
    branches: [main]
    paths:
      - relay/**
      - .github/workflows/relay-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      dir: relay
      image: ghcr.io/protopiatech-labs/relay

name: image

# Reusable: vet, test and push one multi-arch image tagged 1.0.<caller run number>.
# In a called workflow github.run_number is the caller's, so each caller keeps its own sequence.
on:
  workflow_call:
    inputs:
      dir:
        description: Directory with go.mod and Dockerfile
        type: string
        required: true
      image:
        description: Image repository, e.g. ghcr.io/protopiatech-labs/shop
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.dir }}/go.mod

      - name: Vet and test
        working-directory: ${{ inputs.dir }}
        run: |
          go vet ./...
          go test ./...

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if the tag exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists; tags are immutable"
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ env.VERSION }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.dir }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.dir }}
          cache-to: type=gha,mode=max,scope=${{ inputs.dir }}

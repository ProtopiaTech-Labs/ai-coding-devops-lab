# Read-only: loadgen lists registered namespaces, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgen
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-loadgen
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-loadgen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-loadgen
subjects:
  - kind: ServiceAccount
    name: loadgen
    namespace: lab-loadgen

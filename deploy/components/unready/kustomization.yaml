# Not ready: orders fails /readyz, its Service has no endpoints, Traefik answers 503.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
      spec:
        template:
          spec:
            containers:
              - name: orders
                env:
                  - name: CHAOS
                    value: unready

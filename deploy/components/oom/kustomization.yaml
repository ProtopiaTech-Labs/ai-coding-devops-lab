# OOMKilled: orders allocates memory at start under a low limit.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
      spec:
        template:
          spec:
            containers:
              - name: orders
                env:
                  - name: CHAOS
                    value: oom
                resources:
                  limits:
                    memory: 32Mi

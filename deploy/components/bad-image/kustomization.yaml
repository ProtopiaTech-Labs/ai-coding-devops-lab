# ImagePullBackOff: orders points at a tag that does not exist.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
      spec:
        template:
          spec:
            containers:
              - name: orders
                image: ghcr.io/protopiatech-labs/shop:0.0.0-does-not-exist

# CreateContainerConfigError: orders reads a ConfigMap that does not exist.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
      spec:
        template:
          spec:
            containers:
              - name: orders
                envFrom:
                  - configMapRef:
                      name: shop-config-missing

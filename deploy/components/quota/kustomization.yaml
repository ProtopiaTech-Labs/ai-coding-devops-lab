# exceeded quota: orders requests more CPU than the namespace ResourceQuota allows.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders
      spec:
        template:
          spec:
            containers:
              - name: orders
                resources:
                  requests:
                    cpu: "1"

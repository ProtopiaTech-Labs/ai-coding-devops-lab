# Timeouts: inventory delays every response by 5 s, orders returns 504 (2 s client timeout).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inventory
      spec:
        template:
          spec:
            containers:
              - name: inventory
                env:
                  - name: CHAOS
                    value: slow

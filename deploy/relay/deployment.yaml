# One replica with Recreate: SQLite on a ReadWriteOnce disk has one writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  labels:
    app.kubernetes.io/name: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay
    spec:
      serviceAccountName: relay
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/protopiatech-labs/relay
          env:
            - name: TARGET_DOMAIN
              value: lab.patoarchitekci.io
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: participants
              mountPath: /etc/relay/participants.txt
              subPath: participants.txt
              readOnly: true
            - name: secret
              mountPath: /etc/relay/secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: relay-data
        - name: participants
          configMap:
            name: relay-participants
        - name: secret
          secret:
            secretName: relay-admin

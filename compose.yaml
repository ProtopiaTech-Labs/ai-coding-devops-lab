# Local scenario: the three shop services and loadgen from one image.
# Run scripts/scenario-local.sh for the full check.
x-shop: &shop
  image: shop:local
  build:
    context: app
    args:
      VERSION: ${VERSION:-local}
  # A hard limit without swap, so /chaos/oom ends in a container OOM kill.
  mem_limit: 128m
  memswap_limit: 128m

services:
  orders:
    <<: *shop
    environment:
      ROLE: orders
      INVENTORY_URL: http://inventory:8080
      PAYMENTS_URL: http://payments:8080
    ports:
      - "${ORDERS_PORT:-8080}:8080"
    depends_on: [inventory, payments]
  inventory:
    <<: *shop
    environment:
      ROLE: inventory
    ports:
      - "${INVENTORY_PORT:-8081}:8080"
  payments:
    <<: *shop
    environment:
      ROLE: payments
    ports:
      - "${PAYMENTS_PORT:-8082}:8080"
  loadgen:
    <<: *shop
    environment:
      ROLE: loadgen
      TARGETS: http://orders:8080
    depends_on: [orders]
